  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  // QRMode

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [

    --rose: #D69488; --rose-soft: #3B2926; --on-ink: #1B1C1A; color-scheme: dark }

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">for estheticians</p>

      <button type="button" data-view="salon">サロン情報</button>
      <button type="button" data-view="data">データ</button>
    </nav>
  </header>
  <div id="storageNotice" class="notice warn" hidden></div>
  <div id="backupNotice" class="notice warn" hidden></div>
  <main id="main"></main>
</div>
<div id="overlayRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
'use strict';
const STORAGE_KEY = 'lulucie-salon-v1';
// ★ App Store で公開されたら、ここにお客様アプリの App Store の URL を入れる（例：'https://apps.apple.com/jp/app/id0000000000'）。
//    空のあいだは「公開前（テスト版の招待で配布中）」と表示し、リンクやQRは出さない。
const APP_STORE_URL = 'https://apps.apple.com/jp/app/id6826615392';
// Android のお客様向けウェブ版。記録の中身は # 以降に入れる（# 以降はサーバーへ送られない）
const WEB_APP_URL = 'https://kengohayano10.github.io/lulucie/web.html';
function webURLFor(appURL) {
  const q = String(appURL || '').split('?')[1];
  return q ? `${WEB_APP_URL}#${q}` : null;
}
// お客様アプリ（MenuCatalog）と同じ ID。標準メニューは ID で、それ以外は名前で照合される
const BUILTIN_MENUS = [
  ['builtin.hydraFacial', '毛穴ハイドラフェイシャル'], ['builtin.herbPeeling', 'ハーブピーリング'],
  ['builtin.hifu', 'ハイフ'], ['builtin.corugi', '小顔コルギ'], ['builtin.medicalHairRemoval', '医療脱毛'],
  ['builtin.salonHairRemoval', 'サロン脱毛'], ['builtin.lashPerm', 'まつ毛パーマ'], ['builtin.browSalon', '眉サロン'],
  ['builtin.gelNail', 'ジェルネイル'], ['builtin.lashExtension', 'まつ毛エクステ'], ['builtin.hairColor', 'ヘアカラー'],
];
const DEFAULT_TAGS = ['強め圧が好き', '会話控えめ希望', 'ラベンダーの香り', '敏感肌・赤み出やすい', 'ハーブティー好き'];
const CARE_KINDS = [['d', '当日'], ['p', '期間'], ['o', '次回まで']];
const LIMIT = { name: 40, text: 80, message: 200, note: 300, care: 10 };

// ---------- 日付・ID ----------
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID().toUpperCase();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`.toUpperCase();
}

// ---------- 保存（このブラウザの中だけ） ----------
let storageOK = true;
function emptyState() {
  return {
    v: 1,
    profile: { salonName: '', staffName: '', bookingURL: '', perk: '' },
    menus: BUILTIN_MENUS.map(([id, name]) => ({ id, name, builtin: true, archived: false, interval: null, follow: null, care: [] })),
    tags: DEFAULT_TAGS.slice(),
    clients: [],
  };
}
// 初回だけ、画面確認用の架空のお客様を入れる（データ画面からまとめて削除できる）
function sampleClients() {
  const t = today();
  const visit = (menuId, menuName, days, note = '') => ({ id: uuid(), menuId, menuName, date: addDays(t, days), note, url: null });
  return [
    { id: uuid(), name: '佐藤 美咲', isSample: true, tags: ['ラベンダーの香り', 'ハーブティー好き'], memo: '来月ハワイ旅行。日焼けが気になるとのこと。',
      visits: [visit('builtin.hydraFacial', '毛穴ハイドラフェイシャル', -56), visit('builtin.hydraFacial', '毛穴ハイドラフェイシャル', -28, '小鼻の毛穴が気になる')] },
    { id: uuid(), name: '田中 彩', isSample: true, tags: ['会話控えめ希望', '敏感肌・赤み出やすい'], memo: 'お仕事が繁忙期。施術中はゆっくり休みたい。',
      visits: [visit('builtin.herbPeeling', 'ハーブピーリング', -14)] },
    { id: uuid(), name: '山本 結衣', isSample: true, tags: ['強め圧が好き'], memo: '推しのライブ前にフェイスラインを整えたい。',
      visits: [visit('builtin.corugi', '小顔コルギ', -40), visit('builtin.hifu', 'ハイフ', -10)] },
  ];
}
function normalize(s) {
  if (!s || typeof s !== 'object' || s.v !== 1 || !Array.isArray(s.clients) || !Array.isArray(s.menus)) throw new Error('format');
  s.profile = Object.assign({ salonName: '', staffName: '', bookingURL: '', perk: '' }, s.profile || {});
  const ids = new Set(s.menus.map(m => m.id));
  for (const [id, name] of BUILTIN_MENUS) if (!ids.has(id)) s.menus.push({ id, name, builtin: true, archived: false, interval: null, follow: null, care: [] });
  s.menus.forEach(m => { m.care = Array.isArray(m.care) ? m.care : []; });
  s.tags = Array.isArray(s.tags) ? s.tags : DEFAULT_TAGS.slice();
  s.clients.forEach(c => { c.tags = Array.isArray(c.tags) ? c.tags : []; c.visits = Array.isArray(c.visits) ? c.visits : []; c.memo = c.memo || ''; });
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {
    storageOK = false;
  }
  const s = emptyState();
  s.clients = sampleClients();
  return s;
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
  renderStorageNotice();
}

let state = load();
const ui = { view: 'clients', clientId: null, query: '', visitOpen: false };
try { const v = localStorage.getItem(STORAGE_KEY + ':view'); if (['clients', 'menus', 'salon', 'data', 'install'].includes(v)) ui.view = v; } catch (e) {}

// ---------- 共通 ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const menuById = id => state.menus.find(m => m.id === id);
const clientById = id => state.clients.find(c => c.id === id);
function dateLabel(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const w = '日月火水木金土'[new Date(y, m - 1, d).getDay()];
  return `${y}.${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')}（${w}）`;
}
function toast(text) {
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast">${esc(text)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ''; }, 2600);
}
function validURL(u) {
  if (!u) return true;
  try { const x = new URL(u); return x.protocol === 'https:' && !!x.host; } catch (e) { return false; }
}
function intOrNull(v, min, max) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  return Number.isInteger(n) && n >= min && n <= max ? n : NaN;
}
function renderStorageNotice() {
  const el = $('#storageNotice');
  el.hidden = storageOK;
  if (!storageOK) el.textContent = 'このブラウザでは保存できない状態です（プライベートブラウズやサイトデータのブロックなど）。ページを閉じると入力内容が消えます。「データ」から書き出して保管してください。';
}

// ---------- ひかえの催促・カルテが消えたときの案内 ----------
const BACKUP_REMIND_DAYS = 7;
function daysSinceExport() {
  const t = Date.parse(state.lastExportAt || '');
  return Number.isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000);
}
function exportDateLabel() {
  const t = Date.parse(state.lastExportAt || '');
  if (Number.isNaN(t)) return 'まだ書き出していません';
  const d = new Date(t);
  return `最後に書き出した日：${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}
function renderBackupNotice() {
  const el = $('#backupNotice');
  const hasReal = state.clients.some(c => !c.isSample);
  let text = '', canClose = false;
  if (state.clients.length && !hasReal && !state.restoreHintClosed) {
    // ブラウザにデータを消されると、はじめてのときと同じサンプルだけの状態に戻る
    text = '以前このブラウザで使っていた場合は、カルテが消えている可能性があります。新しく入力する前に、ひかえのファイルを読み込んでください。はじめて使う場合は、このお知らせを閉じてください。';
    canClose = true;
  } else if (hasReal) {
    const days = daysSinceExport();
    if (days === null) text = 'まだひかえを取っていません。カルテはこのブラウザの中だけにあり、消えることがあります。ファイルに書き出して保管してください。';
    else if (days >= BACKUP_REMIND_DAYS) text = `前回のひかえから${days}日たちました。カルテはこのブラウザの中だけにあり、消えることがあります。ファイルに書き出して保管してください。`;
  }
  el.hidden = !text;
  if (!text) { el.textContent = ''; return; }
  el.innerHTML = `<p style="margin:0 0 8px">${esc(text)}</p><div class="row">
    ${ui.view === 'data' ? '' : '<button type="button" class="btn small" id="backupGo">データ画面を開く</button>'}
    ${canClose ? '<button type="button" class="btn outline small" id="backupClose">閉じる</button>' : ''}</div>`;
  $('#backupGo')?.addEventListener('click', () => setView('data'));
  $('#backupClose')?.addEventListener('click', () => { state.restoreHintClosed = true; save(); renderBackupNotice(); });
}
function markExported() {
  state.lastExportAt = new Date().toISOString();
  save();
  render();
}

// ---------- QRコード ----------
function b64url(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
// お客様アプリ（SalonHandoffCodec）と同じ形。JSON を raw deflate で縮め、lulucie://receive?d= に入れる
async function encodeHandoff(obj) {
  const json = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== 'undefined') {
    try {
      const cs = new CompressionStream('deflate-raw');
      const buf = await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer();
      return 'lulucie://receive?d=' + b64url(new Uint8Array(buf));
    } catch (e) { /* 圧縮できないブラウザは j= で渡す */ }
  }
  return 'lulucie://receive?j=' + b64url(json);
}
function qrSVG(text) {
  if (typeof qrcode === 'undefined') return null;
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), q = 4;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + q} ${r + q}h1v1h-1z`;
  // 読み取りやすさのため、テーマにかかわらず白地に黒で描く
  return `<svg viewBox="0 0 ${n + q * 2} ${n + q * 2}" role="img" aria-label="お客様アプリで読み取るQRコード" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#FFFFFF"/><path d="${d}" fill="#1B1B1A"/></svg>`;
}

function handoffSummary(h) {
  if (!h) return '';
  const rows = [['サロン', h.s?.n], ['担当', h.s?.e], ['お名前', h.c ? h.c + ' 様' : 'QRに入れていません'],
    ['施術日', dateLabel(h.d)], ['メニュー', h.m?.n],
    ['次回の目安', h.iv ? `${h.iv}日後（${dateLabel(addDays(h.d, h.iv))}）` : null],
    ['ご案内の日', h.fu ? dateLabel(addDays(h.d, h.fu)) : null],
    ['アフターケア', h.ac?.length ? h.ac.map(a => a.t).join('／') : null],
    ['次回のご提案', h.nx ? [h.nx.n, h.nx.t].filter(Boolean).join('・') : null],
    ['メッセージ', h.msg], ['予約ページ', h.s?.u]].filter(r => r[1]);
  return `<dl class="summary small">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

function showQR(client, visit) {

              <li>初めての方には、Chrome の「︙」→「ホーム画面に追加」で置いておくと次から開きやすいことをお伝えください。</li>
            </ol>
            <p class="hint">ウェブ版ではお知らせ（通知）は出ません。ブラウザのデータを消すと記録も消えるため、ウェブ版の「データ」から書き出しておけます。</p>
          </div>

          <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="closeQR2">閉じる</button></div>

  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); opener?.focus?.(); };

    $('#qrBox svg')?.setAttribute('aria-label', kind === 'web' ? 'Android のお客様がカメラで読み取るQRコード' : 'お客様アプリで読み取るQRコード');
    $('#qrStepsApp').hidden = kind === 'web';
    $('#qrStepsWeb').hidden = kind !== 'web';
    document.querySelectorAll('[data-qr]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.qr === kind)));
  };
  document.querySelectorAll('[data-qr]').forEach(b => b.addEventListener('click', () => drawQR(b.dataset.qr)));
  $('#revealQR').addEventListener('click', () => {
    drawQR('app');
    $('#qrCheck').hidden = true;
    $('#qrShow').hidden = false;
    $('#closeQR2').focus();
  });
  $('.overlay').addEventListener('click', e => { if (e.target.classList.contains('overlay')) close(); });
  $('#revealQR').focus();
}

// --- アプリの案内（インストール）。来店記録のQRとは別物 ---

}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

function render() {

function careRowHTML(item, i) {
  const kinds = CARE_KINDS.map(([k, l]) => `<option value="${k}" ${item.k === k ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="care-row" data-i="${i}">
    <select aria-label="ケアの時期" data-care="k">${kinds}</select>
    <input type="number" aria-label="日数" data-care="n" min="2" max="60" value="${item.k === 'p' ? (item.n ?? 3) : ''}" placeholder="日数" ${item.k === 'p' ? '' : 'disabled'}>
    <input type="text" aria-label="ケアの内容" data-care="t" maxlength="${LIMIT.text}" value="${esc(item.t)}" placeholder="例：当日はメイクを控えめに">
    <button type="button" class="btn quiet small" data-care-remove aria-label="この項目を削除">削除</button>
  </div>`;
}
function readCareRows(root) {
  return [...root.querySelectorAll('.care-row')].map(r => {
    const k = r.querySelector('[data-care=k]').value;
    const raw = r.querySelector('[data-care=n]').value;
    return { k, n: k === 'p' ? (raw === '' ? 3 : Number(raw)) : null, t: r.querySelector('[data-care=t]').value.trim() };
  });
}
function bindCareEditor(root, initial) {
  let items = initial.map(x => ({ ...x }));
  const draw = () => {
    root.innerHTML = items.map(careRowHTML).join('') || '<p class="hint">ケア案内はありません。「項目を追加」で入れられます。</p>';
    root.querySelectorAll('[data-care=k]').forEach(sel => sel.addEventListener('change', () => { items = readCareRows(root); draw(); }));
    root.querySelectorAll('[data-care-remove]').forEach(btn => btn.addEventListener('click', () => {
      items = readCareRows(root); items.splice(Number(btn.closest('.care-row').dataset.i), 1); draw();
    }));
  };
  draw();
  return {
    add() {
      items = readCareRows(root);
      if (items.length >= LIMIT.care) { toast(`ケア案内は${LIMIT.care}項目までです`); return; }
      items.push({ k: 'o', n: null, t: '' }); draw();
      root.querySelector('.care-row:last-child [data-care=t]')?.focus();
    },
    read() { return readCareRows(root).filter(x => x.t); },
  };
}
function careErrors(items) {
  for (const x of items) if (x.k === 'p' && !(Number.isInteger(x.n) && x.n >= 2 && x.n <= 60)) return '「期間」のケアの日数は2〜60日で入力してください。';
  return '';
}

// ---------- 操作 ----------
function bind() {
  if (ui.view === 'clients') bindClients();
  else if (ui.view === 'menus') bindMenus();
  else if (ui.view === 'salon') bindSalon();
  else if (ui.view === 'data') bindData();
  else if (ui.view === 'install') bindInstall();
}

function bindClients() {
  $('#addClient')?.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#newClientName').value.trim();
    if (!name) return;
    const c = { id: uuid(), name, isSample: false, tags: [], memo: '', visits: [] };
    state.clients.push(c);
    ui.clientId = c.id; ui.visitOpen = false; ui.query = '';
    save(); render(); toast(`${name} 様を追加しました`);
  });
  const search = $('#search');
  search?.addEventListener('input', () => {
    ui.query = search.value;
    const pos = search.selectionStart;
    render();
    const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos);
  });
  document.querySelectorAll('[data-client]').forEach(b => b.addEventListener('click', () => {
    ui.clientId = b.dataset.client; ui.visitOpen = false; render();
  }));
  const c = clientById(ui.clientId);
  if (!c) return;

  document.querySelectorAll('[data-tag]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.tag;
    c.tags = c.tags.includes(t) ? c.tags.filter(x => x !== t) : [...c.tags, t];
    save(); b.setAttribute('aria-pressed', c.tags.includes(t));
  }));
  $('#addTag')?.addEventListener('submit', e => {
    e.preventDefault();
    const t = $('#newTag').value.trim();
    if (!t) return;
    if (!state.tags.includes(t)) state.tags.push(t);
    if (!c.tags.includes(t)) c.tags.push(t);
    save(); render();
  });
  $('#memo')?.addEventListener('input', e => { c.memo = e.target.value; save(); });
  $('#renameClient')?.addEventListener('click', () => {
    const h = $('#chartName');
    h.innerHTML = `<form id="renameForm" class="row"><input type="text" id="renameInput" maxlength="${LIMIT.name}" value="${esc(c.name)}" aria-label="お名前" style="max-width:240px"><button class="btn small" type="submit">保存</button></form>`;
    $('#renameInput').focus();
    $('#renameForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#renameInput').value.trim();
      if (v) { c.name = v; c.isSample = false; save(); }
      render();
    });
  });
  $('#deleteClient')?.addEventListener('click', () => { $('#deleteConfirm').hidden = false; $('#deleteYes').focus(); });
  $('#deleteNo')?.addEventListener('click', () => { $('#deleteConfirm').hidden = true; });
  $('#deleteYes')?.addEventListener('click', () => {
    state.clients = state.clients.filter(x => x.id !== c.id);
    ui.clientId = null; save(); render(); toast('カルテを削除しました');
  });
  document.querySelectorAll('[data-qr]').forEach(b => b.addEventListener('click', () => {
    const v = c.visits.find(x => x.id === b.dataset.qr);
    if (v) showQR(c, v);
  }));
  $('#openVisit')?.addEventListener('click', () => { ui.visitOpen = true; render(); $('#vMenu')?.focus(); });
  if (ui.visitOpen) bindVisit(c);
}

function bindVisit(c) {
  let care;
  const loadMenuDefaults = () => {
    const m = menuById($('#vMenu').value);
    $('#vInterval').value = m?.interval ?? '';
    $('#vFollow').value = m?.follow ?? '';
    care = bindCareEditor($('#careRows'), m?.care || []);
  };
  loadMenuDefaults();
  $('#vMenu').addEventListener('change', loadMenuDefaults);
  $('#addCare').addEventListener('click', () => care.add());
  $('#cancelVisit').addEventListener('click', () => { ui.visitOpen = false; render(); });
  $('#visitForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#visitError');
    const m = menuById($('#vMenu').value);
    const date = $('#vDate').value;
    const iv = intOrNull($('#vInterval').value, 1, 1095);
    const fu = intOrNull($('#vFollow').value, 1, 1095);
    const items = care.read();
    if (!m) { err.textContent = '施術メニューを選んでください。'; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = '施術日を入力してください。'; return; }
    if (Number.isNaN(iv)) { err.textContent = '施術間隔は1〜1095日の整数で入力してください。'; return; }
    if (Number.isNaN(fu)) { err.textContent = 'フォローの日数は1〜1095日の整数で入力してください。'; return; }
    const ce = careErrors(items); if (ce) { err.textContent = ce; return; }
    err.textContent = '';

    const next = menuById($('#vNext').value);
    const nextNote = $('#vNextNote').value.trim();
    const msg = $('#vMsg').value.trim();
    const p = state.profile;
    const visitId = uuid();
    const salon = { n: p.salonName || '担当サロン' };
    if (p.staffName) salon.e = p.staffName;
    if (p.bookingURL && validURL(p.bookingURL)) salon.u = p.bookingURL;
    if (p.perk) salon.p = p.perk;
    const handoff = { v: 1, id: visitId, s: salon, m: m.builtin ? { id: m.id, n: m.name } : { n: m.name }, d: date };
    if ($('#vName').checked) handoff.c = c.name;
    if (iv != null) handoff.iv = iv;
    if (fu != null) handoff.fu = fu;
    if (next || nextNote) {
      handoff.nx = {};
      if (next?.builtin) handoff.nx.id = next.id;
      if (next) handoff.nx.n = next.name;
      if (nextNote) handoff.nx.t = nextNote;
    }
    if (msg) handoff.msg = msg;
    if (items.length) handoff.ac = items.map(x => (x.k === 'p' ? { k: 'p', n: x.n, t: x.t } : { k: x.k, t: x.t }));

    const url = await encodeHandoff(handoff);
    // h はQRに入れた内容そのもの（お客様に見せる確認用）。担当者メモ・タグ・施術メモはQRに入れない
    const visit = { id: visitId, menuId: m.id, menuName: m.name, date, note: $('#vNote').value.trim(), url, h: handoff };
    c.visits.push(visit);
    ui.visitOpen = false;
    save(); render();
    showQR(c, visit);
  });
}

function bindMenus() {
  $('#addMenu')?.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#newMenuName').value.trim();
    if (!name) return;
    if (state.menus.some(m => m.name === name)) { toast('同じ名前のメニューがあります'); return; }
    state.menus.push({ id: 'salon.' + uuid(), name, builtin: false, archived: false, interval: null, follow: null, care: [] });
    save(); render(); toast(`${name}を追加しました`);
  });
  document.querySelectorAll('.menu-card').forEach(card => {
    const m = menuById(card.dataset.menu);
    const editor = bindCareEditor(card.querySelector('[data-care-root]'), m.care);
    card.querySelector('[data-care-add]').addEventListener('click', () => editor.add());
    card.querySelector('[data-archive-menu]').addEventListener('click', () => { m.archived = !m.archived; save(); render(); });
    card.querySelector('[data-rename-menu]')?.addEventListener('click', () => {
      const h = card.querySelector('h3');
      h.innerHTML = `<form class="row"><input type="text" maxlength="${LIMIT.name}" value="${esc(m.name)}" aria-label="メニュー名" style="max-width:240px"><button class="btn small" type="submit">保存</button></form>`;
      const input = h.querySelector('input'); input.focus();
      h.querySelector('form').addEventListener('submit', e => { e.preventDefault(); const v = input.value.trim(); if (v) { m.name = v; save(); } render(); });
    });
    card.querySelector('[data-menu-save]').addEventListener('click', () => {
      const err = card.querySelector('[data-menu-error]');
      const iv = intOrNull(card.querySelector('[data-menu-interval]').value, 1, 1095);
      const fu = intOrNull(card.querySelector('[data-menu-follow]').value, 1, 1095);
      const items = editor.read();
      if (Number.isNaN(iv) || Number.isNaN(fu)) { err.textContent = '日数は1〜1095の整数で入力してください。'; return; }
      const ce = careErrors(items); if (ce) { err.textContent = ce; return; }
      err.textContent = '';
      m.interval = iv; m.follow = fu; m.care = items;
      save(); toast(`${m.name}を保存しました`);
    });
  });
}

function bindSalon() {
  $('#salonForm').addEventListener('submit', e => {
    e.preventDefault();
    const url = $('#sURL').value.trim();
    if (!validURL(url)) { $('#salonError').textContent = '予約ページは https:// から始まる URL を入力してください。'; return; }
    state.profile = { salonName: $('#sName').value.trim(), staffName: $('#sStaff').value.trim(), bookingURL: url, perk: $('#sPerk').value.trim() };
    save(); render(); toast('サロン情報を保存しました');
  });
}

function backupText() {
  return JSON.stringify({ format: 'lulucie-salon-backup', exportedAt: new Date().toISOString(), data: state }, null, 2);
}
function bindData() {
  const err = $('#dataError');
  $('#exportData').addEventListener('click', async () => {
    err.textContent = '';
    let downloads = null;
    try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (!downloads) {
      // 通常のウェブページでは、ブラウザのダウンロードで保存する
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([backupText()], { type: 'application/json' }));
      a.download = `lulucie-salon-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      markExported();
      toast('書き出しました（ダウンロードフォルダを確認してください）');
      return;
    }
    try { await downloads.save({ filename: `lulucie-salon-${today()}.json`, data: backupText() }); markExported(); toast('書き出しました'); }
    catch (e) { if (e?.code !== 'declined') err.textContent = 'ファイルに保存できませんでした。「内容をコピー」もお使いいただけます。'; }
  });
  $('#copyData').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(backupText()); markExported(); toast('コピーしました。メモ帳などに貼り付けて保管してください'); }
    catch (e) { err.textContent = 'コピーできませんでした。「ファイルに書き出す」をお試しください。'; }
  });
  $('#importFile').addEventListener('change', async e => {
    err.textContent = '';
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (parsed.format !== 'lulucie-salon-backup') throw new Error('format');
      const incoming = normalize(parsed.data);
      if (typeof parsed.exportedAt === 'string') incoming.lastExportAt = parsed.exportedAt;
      const box = $('#importConfirm');
      box.hidden = false;
      box.innerHTML = `<p style="margin:0 0 8px">「${esc(file.name)}」（お客様 ${incoming.clients.length}名）を読み込みます。今このブラウザにあるデータは置き換わります。</p>
        <div class="row"><button type="button" class="btn small" id="importYes">読み込む</button><button type="button" class="btn outline small" id="importNo">やめる</button></div>`;
      $('#importYes').addEventListener('click', () => { state = incoming; ui.clientId = null; save(); setView('clients'); toast('読み込みました'); });
      $('#importNo').addEventListener('click', () => { box.hidden = true; });
    } catch (x) {
      err.textContent = 'Lulucie Salon の書き出しファイルとして読み込めませんでした。';
    }
  });
  $('#deleteSamples')?.addEventListener('click', () => {
    state.clients = state.clients.filter(c => !c.isSample); ui.clientId = null; save(); render(); toast('サンプルを削除しました');
  });
  $('#wipe').addEventListener('click', () => { $('#wipeConfirm').hidden = false; });
  $('#wipeNo').addEventListener('click', () => { $('#wipeConfirm').hidden = true; });
  $('#wipeYes').addEventListener('click', () => {
    state = emptyState(); ui.clientId = null; save(); setView('clients'); toast('すべて消去しました');
  });
}

// 初回のサンプルも含めて保存し、ブラウザにデータを消されにくくするよう依頼する
save();
try { navigator.storage?.persist?.().catch(() => {}); } catch (e) {}
render();
</script>
</body>
</html>
