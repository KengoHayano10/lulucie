<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lulucie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root { --bg: #FBF9F6; --ink: #2B2A28; --stone: #6F6A63; --line: rgba(43,42,40,.14); --sage: #5F7466; --champagne: #A88B5E;
          --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
          --body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1C1D1B; --ink: #ECE8E1; --stone: #A9A39A; --line: rgba(236,232,225,.16); --sage: #A3B8A9; --champagne: #D2B98F; color-scheme: dark } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.9; }
  main { max-width: 640px; margin: 0 auto; padding-block: 72px 88px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { font-family: var(--display); color: var(--champagne); letter-spacing: .24em; font-size: .8rem; margin: 0 0 10px; }
  h1 { font-family: var(--display); font-weight: 500; font-style: italic; font-size: 2.4rem; margin: 0; }
  .lead { color: var(--stone); margin: 6px 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: flex; justify-content: space-between; gap: 16px; padding: 18px 2px; color: inherit; text-decoration: none; }
  a span:first-child { font-family: var(--display); font-size: 1.1rem; }
  a span:last-child { color: var(--stone); font-size: .88rem; text-align: right; }
  a:hover span:first-child, a:focus-visible span:first-child { color: var(--sage); }
  footer { margin-top: 40px; color: var(--stone); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <p class="brand">CALM DESIGN</p>
  <h1>Lulucie</h1>
  <p class="lead">私をととのえる、美肌サイクル手帖</p>
  <ul>
    <li><a href="support.html"><span>サポート</span><span>お問い合わせ・よくある質問</span></a></li>
    <li><a href="privacy.html"><span>プライバシーポリシー</span><span>情報の取り扱い</span></a></li>
    <li><a href="web.html"><span>Lulucie ウェブ版</span><span>Android のお客様向け</span></a></li>
    <li><a href="salon.html"><span>Lulucie Salon</span><span>サロン向けのカルテとお渡し</span></a></li>
  </ul>
  <footer>© 2026 Calm Design</footer>
</main>
</body>
</html>
